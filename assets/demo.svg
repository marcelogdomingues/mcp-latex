  <text xml:space="preserve" x="20" y="116"><tspan fill="#c9d1d9">  { </tspan><tspan fill="#79c0ff">"kind"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ff7b72">"undefinedReference"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">"name"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ffa657">"missing"</tspan><tspan fill="#c9d1d9"> } ] }</tspan></text>
  <text xml:space="preserve" x="20" y="156"><tspan fill="#8b949e">assistant</tspan><tspan fill="#c9d1d9"> → </tspan><tspan fill="#d2a8ff">parse_log</tspan><tspan fill="#c9d1d9"> { </tspan><tspan fill="#79c0ff">"path"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ffa657">"main.log"</tspan><tspan fill="#c9d1d9"> }</tspan></text>
