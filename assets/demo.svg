  <text xml:space="preserve" x="20" y="204"><tspan fill="#c9d1d9">  { </tspan><tspan fill="#79c0ff">"message"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ff7b72">"Undefined control sequence."</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">"line"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">42</tspan><tspan fill="#c9d1d9"> } ] }</tspan></text>
